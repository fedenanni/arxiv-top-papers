[project]
name = "arxiv-rank"
version = "0.1.0"
description = "Fetch citation counts for arXiv cs.AI papers and report top-cited papers per month."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.31",
    "tqdm>=4.66",
    "kaggle>=2.2.1",
]

[project.scripts]
csai-citations = "csai_citations.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["csai_citations"]
